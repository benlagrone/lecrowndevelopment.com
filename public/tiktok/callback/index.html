<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>TikTok authorization | LeCrown Development</title>
    <style>
      :root {
        color: #161d2d;
        background: #f2efe7;
        font-family: "Avenir Next", "Segoe UI Variable", "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(70, 217, 207, 0.18), transparent 26%),
          radial-gradient(circle at top right, rgba(255, 147, 90, 0.14), transparent 24%),
          linear-gradient(180deg, #fffdf8 0%, #f2efe7 100%);
      }

      a { color: inherit; }

      .nav,
      main {
        width: min(860px, calc(100vw - 2rem));
        margin-inline: auto;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 999px;
        background: rgba(255, 253, 248, 0.8);
        box-shadow: 0 14px 34px rgba(15, 23, 38, 0.08);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        font-weight: 800;
        text-decoration: none;
      }

      .brand img {
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 0.7rem;
      }

      .back {
        color: #5e667a;
        font-weight: 700;
        text-decoration: none;
      }

      main { padding: clamp(3rem, 7vw, 6rem) 0 5rem; }

      article {
        padding: clamp(1.5rem, 5vw, 3.25rem);
        border: 1px solid rgba(15, 23, 38, 0.12);
        border-radius: 1.75rem;
        background: rgba(255, 255, 255, 0.76);
        box-shadow: 0 24px 60px rgba(12, 18, 32, 0.14);
      }

      .eyebrow {
        margin: 0 0 0.7rem;
        color: #5e667a;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
        font-size: clamp(2.4rem, 7vw, 4.4rem);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      p {
        color: #394256;
        font-size: 1rem;
        line-height: 1.7;
      }

      #status { margin-top: 1.4rem; }

      @media (max-width: 540px) {
        .nav { align-items: flex-start; border-radius: 1.25rem; }
        .back { padding-top: 0.4rem; }
      }
    </style>
  </head>
  <body>
    <nav class="nav" aria-label="Primary">
      <a class="brand" href="/">
        <img src="/logo-mark.png" alt="LeCrown Development" />
        <span>LeCrown Development</span>
      </a>
      <a class="back" href="/">Back to site</a>
    </nav>
    <main>
      <article>
        <p class="eyebrow">TikTok</p>
        <h1>Authorization return</h1>
        <p id="status">This address receives the TikTok Login Kit redirect.</p>
      </article>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var status = document.getElementById("status");
        var error = params.get("error") || "";
        if (/^[a-z0-9_.-]{1,64}$/i.test(error)) {
          status.textContent = "TikTok did not complete authorization (" + error + ").";
          return;
        }
        if (params.get("code")) {
          status.textContent = "TikTok returned an authorization code to this browser. This page does not store or display it.";
          return;
        }
        status.textContent = "This address receives the TikTok Login Kit redirect. Open it from TikTok after approving the app.";
      })();
    </script>
  </body>
</html>
